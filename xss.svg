<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="260" viewBox="0 0 900 260">

  <rect width="100%" height="100%" fill="#0b1220"/>

  <text x="30" y="70"
        font-family="Arial, sans-serif"
        font-size="38"
        font-weight="700"
        fill="#ffffff">
    SVG XSS Test
  </text>

  <text x="30" y="115"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#cbd5e1">
    If this triggers an alert, JS execution is happening in SVG.
  </text>

  <text x="30" y="150"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#cbd5e1">
    Expected in most cases: NO alert (blocked) ✅
  </text>

  <script>
    alert("XSS via SVG executed");
  </script>

</svg>
