<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="220" viewBox="0 0 600 220"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <rect width="100%" height="100%" fill="#0b1220"/>

  <text x="20" y="60"
        font-family="Arial, sans-serif"
        font-size="28"
        font-weight="700"
        fill="#ffffff">
    External Fetch Test
  </text>

  <text x="20" y="105"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#cbd5e1">
    If this loads, external resources are allowed.
  </text>

  <!-- Replace with your OAST / webhook pixel -->
  <image x="20" y="140" width="1" height="1"
         xlink:href="https://YOUR-OAST-DOMAIN/pixel.png" />

</svg>
